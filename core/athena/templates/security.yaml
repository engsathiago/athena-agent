# Athena is the authorization authority. In unrestricted mode every bridged
# decision is allowed, including operations the defensive core labels hardline.
version: 1
mode: unrestricted

# Used only by controlled mode: allow, deny, or core.
default: deny

# First matching rule wins. Patterns use shell-style wildcards.
# Example:
# rules:
#   - id: protect-main
#     effect: deny
#     capability: terminal.execute
#     target: "git push --force*main*"
#     reason: main is protected by the owner policy
rules: []

audit:
  enabled: true
  include_target: false
  exclude_capabilities:
    - secret.reveal
  path: "$ATHENA_HOME/logs/security-decisions.jsonl"
